name: CARE CI — Backend Testing

on:
  push:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"
      - "sonar-project.properties"
  pull_request:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"
      - "sonar-project.properties"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 如果不想用 Atlas 跑測試，也可以在這裡啟動本地 MongoDB Docker
      # 但使用者提到「分離測試 DB」，通常是指外部 Atlas 測試環境
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov  # 額外安裝覆蓋率工具

      - name: Run tests with pytest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_URL: ${{ secrets.MONGODB_URI }}
          MONGODB_COLLECTION: ${{ vars.MONGODB_COLLECTION }}
          MONGODB_VECTOR_INDEX: ${{ vars.MONGODB_VECTOR_INDEX }}
          MONGODB_VECTOR_FIELD: ${{ vars.MONGODB_VECTOR_FIELD }}
          MONGODB_TEXT_FIELD: ${{ vars.MONGODB_TEXT_FIELD }}
          MONGODB_VECTOR_DIM: ${{ vars.MONGODB_VECTOR_DIM }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
          LIFF_CHANNEL_ID: ${{ secrets.LIFF_CHANNEL_ID }}
          LIFF_CHANNEL_SECRET: ${{ secrets.LIFF_CHANNEL_SECRET }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # 選填，若有 Codecov 帳號可設定

      # SonarCloud：在 repo Secrets 設定 SONAR_TOKEN；fork 發起的 PR 通常無 Secret，故此步會略過。
      # SonarQube Server：須在本 step 的 env 加入 SONAR_HOST_URL（常用 Repository variables），見 SonarSource 官方說明。
      - name: SonarQube Scan
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
