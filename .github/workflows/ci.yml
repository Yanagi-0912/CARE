# 後端測試 + Codecov。SonarCloud 由專案端「自動分析」執行，不在此 workflow 跑 scan，避免與 Sonar 自動掃描重疊。
name: CARE CI — Backend Testing

on:
  push:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 如果不想用 Atlas 跑測試，也可以在這裡啟動本地 MongoDB Docker
      # 但使用者提到「分離測試 DB」，通常是指外部 Atlas 測試環境
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag v5.0.0 (Node 24)

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true

      # --locked：uv.lock 與 pyproject.toml 不一致就讓 CI 失敗，而非默默重解版本。
      # pytest / pytest-cov 屬 dev 群組，由 uv.lock 一併帶入，不必額外 pip install。
      - name: Install dependencies
        run: uv sync --locked

      # 本地分類器（guardrail、急迫度、走失、RAG 路由）自 2026-09-19 起改用
      # 句向量，模型檔 129MB 不進 repo（.gitignore 的 models/），正式映像是
      # Dockerfile 在 build 時下載。CI 少了這一步，載得到模型的測試從 09-19
      # 起全數 FileNotFoundError——CI 因此紅了四天，紅的不是程式。
      #
      # 快取鍵綁 fetch_text_encoder.py 的內容：那支腳本把模型的 commit 釘死
      # 在裡面，腳本沒變就代表要抓的是同一份檔案，改了就自動換一份快取。
      - name: Cache sentence encoder
        uses: actions/cache@v4
        with:
          path: models/multilingual-e5-small
          key: text-encoder-${{ hashFiles('scripts/fetch_text_encoder.py') }}

      # 快取命中時腳本自己會略過（檔案已存在），不會重抓。
      - name: Fetch sentence encoder
        run: uv run python scripts/fetch_text_encoder.py

      - name: Run tests with pytest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_URL: ${{ secrets.MONGODB_URI }}
          MONGODB_COLLECTION: ${{ vars.MONGODB_COLLECTION }}
          MONGODB_VECTOR_INDEX: ${{ vars.MONGODB_VECTOR_INDEX }}
          MONGODB_VECTOR_FIELD: ${{ vars.MONGODB_VECTOR_FIELD }}
          MONGODB_TEXT_FIELD: ${{ vars.MONGODB_TEXT_FIELD }}
          MONGODB_VECTOR_DIM: ${{ vars.MONGODB_VECTOR_DIM }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
          LIFF_CHANNEL_ID: ${{ secrets.LIFF_CHANNEL_ID }}
          LIFF_CHANNEL_SECRET: ${{ secrets.LIFF_CHANNEL_SECRET }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PYTHONPATH: .
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=xml

