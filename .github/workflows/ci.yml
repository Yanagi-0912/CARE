name: CARE CI/CD - Backend Testing

on:
  push:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 如果不想用 Atlas 跑測試，也可以在這裡啟動本地 MongoDB Docker
      # 但使用者提到「分離測試 DB」，通常是指外部 Atlas 測試環境
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov  # 額外安裝覆蓋率工具

      - name: Run tests with pytest
        env:
          # 使用 GitHub Secrets 中的測試資料庫 URI
          # 若 Secrets 未設定，預設會使用上面的本地 MongoDB service (localhost)
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST || 'mongodb://localhost:27017' }}
          MONGODB_DB: care_test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # 選填，若有 Codecov 帳號可設定
