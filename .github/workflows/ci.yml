# 後端測試 + Codecov。SonarCloud 由專案端「自動分析」執行，不在此 workflow 跑 scan，避免與 Sonar 自動掃描重疊。
name: CARE CI — Backend Testing

on:
  push:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 如果不想用 Atlas 跑測試，也可以在這裡啟動本地 MongoDB Docker
      # 但使用者提到「分離測試 DB」，通常是指外部 Atlas 測試環境
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag v5.0.0 (Node 24)

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # tag v6.0.0 (Node 24)
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov  # 額外安裝覆蓋率工具

      - name: Run tests with pytest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_URL: ${{ secrets.MONGODB_URI }}
          MONGODB_COLLECTION: ${{ vars.MONGODB_COLLECTION }}
          MONGODB_VECTOR_INDEX: ${{ vars.MONGODB_VECTOR_INDEX }}
          MONGODB_VECTOR_FIELD: ${{ vars.MONGODB_VECTOR_FIELD }}
          MONGODB_TEXT_FIELD: ${{ vars.MONGODB_TEXT_FIELD }}
          MONGODB_VECTOR_DIM: ${{ vars.MONGODB_VECTOR_DIM }}
          LIFF_URL: ${{ secrets.LIFF_URL }}
          LIFF_CHANNEL_ID: ${{ secrets.LIFF_CHANNEL_ID }}
          LIFF_CHANNEL_SECRET: ${{ secrets.LIFF_CHANNEL_SECRET }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml

