[project]
name = "care"
version = "0.1.0"
description = "CARE — LINE 藥物照護助理後端（FastAPI）"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # FastAPI 框架和 Uvicorn 伺服器
    "fastapi==0.129.0",
    "uvicorn==0.41.0",
    "starlette==0.52.1",
    # 藥袋掃描端點以 multipart 上傳影像，FastAPI 的 UploadFile／File 依賴此套件解析表單
    "python-multipart==0.0.32",

    # LINE Bot SDK
    "line-bot-sdk==3.22.0",

    # Text-to-speech
    "edge-tts==7.2.8",
    "gTTS==2.5.4",
    "mutagen==1.47.0",
    # 台語語音的轉檔（app/services/speech/audio.py）：LINE 錄音 m4a → 台語 STT 收的 wav、
    # 台語 TTS 的 WAV → LINE 用的 mp3。wheel 內附 FFmpeg 函式庫（裝起來約 44 MB），
    # 映像不必另外 apt 裝 ffmpeg。
    "av==18.1.0",

    # 環境變數設定
    "python-dotenv==1.1.1",

    # HTTP 請求相關（用於 Gemini API 和其他 HTTP 請求）
    "requests==2.32.5",
    "httpx==0.28.1",

    # LangChain（GeminiService 主回覆與 Guardrail 結構化分類）
    "langchain-core==1.6.3",
    # 4.2.2 把 google-genai 釘在 <2.0.0，拿不到語者分離（`AudioTranscriptionConfig`
    # 到 google-genai 2.x 才有 `diarization`／`custom_vocabulary`／`word_timestamp`
    # 三個欄位）。4.3.0 起放寬到 google-genai<3.0.0，看診逐字稿因此才做得成；
    # 取當前最新的 4.4.0（相對 4.3.7 只多了影片理解，沒有破壞性變更）。
    # 連帶要求 langchain-core>=1.6.1，所以下面那行才從 1.3.2 升上來。
    "langchain-google-genai==4.4.0",
    # 由 langchain-google-genai 帶進來，但看診逐字稿直接用它的型別，明著釘住版本。
    "google-genai==2.23.0",
    "langgraph==1.1.10",
    "orjson>=3.11.5",

    # MongoDB（內文與 BM25；RAG 的向量那一半已移到 pgvector）
    # Motor 3.6 鎖 pymongo<4.10，與 4.16 衝突；3.7+ 為 pymongo>=4.9,<5
    "pymongo==4.16.0",
    "motor==3.7.1",

    # PostgreSQL + pgvector（RAG 向量檢索，見 services/rag/pgvector_retriever.py）。
    # 2026-09-19 從 Atlas 搬過來：3072 維向量把免費層 512 MB 撐爆導致寫入被鎖。
    # 只用 asyncpg 不引入 pgvector 套件——查詢向量以文字字面量傳入再由 PG 轉型，
    # 少一個相依，代價是每次查詢多一次字串組裝（相對整條管線可忽略）。
    "asyncpg==0.31.0",

    # 守門測試需要實際解碼已提交的藥丸照片縮圖以驗證尺寸與格式
    # （tests/unit/resources/test_drug_appearance_images.py），非建置腳本本身
    # 的相依——建置腳本沿用既有的 ImageMagick CLI（見 scripts/build_drug_catalog.py）
    "Pillow==12.3.0",
    # 家庭邀請的 QR 圖片（app/services/family/invite_qr_service.py）。純 Python、
    # 零相依，PNG 輸出不必經過 Pillow。
    "segno==1.6.6",

    # 工具套件
    "pydantic==2.12.5",
    "typing-extensions==4.15.0",
    "PyJWT==2.10.1",
    "redis==5.2.1",
    # zoneinfo 需要 IANA 時區資料庫。Windows 沒有內建（實測 import 即失敗），
    # 精簡版 Linux 映像（python:*-slim）也不保證含 tzdata 套件。
    # 少了它，app/models/medication.py 的 ZoneInfo("Asia/Taipei") 會在 import
    # 期間直接拋 ZoneInfoNotFoundError，整個服務起不來。
    "tzdata==2026.3",

    # 本地分類器的句向量特徵（app/services/guardrail/text_encoder.py）。
    # 只有這兩個套件，沒有 torch——模型是預先匯出的 int8 ONNX，執行期不需要
    # 訓練框架。兩者加起來約 50MB，模型檔另外 135MB（Dockerfile build 時抓）。
    #
    # 為什麼值得：2026-09-19 實測四個模型合併字面＋語意特徵後全部變好，
    # rag_route 的「本地解掉」從 54.2% 升到 66.7%，等於多 12.5% 的訊息
    # 跳過 agent 選工具那次呼叫（中位數 3.2 秒）。詳見 text_encoder 模組註解。
    "onnxruntime==1.30.0",
    "tokenizers==0.23.2",
]

# 測試相關（pytest-asyncio 0.25 僅支援 pytest<9）。
# 不進 [project.dependencies]，正式映像以 `uv sync --no-dev` 排除。
[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio==0.25.0",
    "pytest-cov==7.0.0",

    # 四個本地分類器的**訓練**用（scripts/build_guardrail_model.py）。
    # sklearn 仍然只在建置期需要：訓練產出的是 resources/*_model.json 裡的
    # 權重，執行期只做查表、點積與一次 sigmoid。
    #
    # 2026-09-19 前這裡還寫著「執行期不需要任何模型框架」，理由是
    # 「sklearn + numpy + scipy 逾 100MB，而那台 K3s VM 有磁碟壓力前科」。
    # 那個限制已經不成立：當時 / 用到 79%，是因為每次部署留下的舊映像
    # 沒有任何機制回收（74 個映像只有 14 個在用）；CARE-infra f141fdc 讓
    # 部署後自動保留最新 3 版，磁碟降到 32%、可用 40G。**限制解除之後
    # 才加依賴，不是因為需要就繞過它。**
    #
    # 與 scripts/build_drug_catalog.py 同一個模式：重的工具留在建置期，
    # 正式映像只 COPY app、resources 與 models。
    "scikit-learn>=1.5,<2",
    # 訓練時要算句向量，而算的方式必須與執行期完全相同（同一支
    # OnnxTextEncoder）。所以 onnxruntime／tokenizers 兩邊都要有——
    # 它們在 [project.dependencies] 裡，dev 環境自然也裝得到，這裡不必重列。
]

# CARE 是應用程式不是函式庫：不建置成套件，`app` 由 pytest.ini 的 pythonpath 匯入。
[tool.uv]
package = false
