# SonarCloud：在 https://sonarcloud.io 建立並綁定 GitHub repo 後，將下列兩行改為控制台顯示的值。
# （自建 SonarQube Server 可刪除此二行並改在平台上建立專案，另於 CI 設定 SONAR_HOST_URL。）
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG_KEY
sonar.projectKey=REPLACE_WITH_PROJECT_KEY

sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/node_modules/**,__pycache__/**,**/app_data/**
